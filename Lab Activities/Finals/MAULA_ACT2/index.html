<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    body{
        text-align: center;
        margin-top: 100px;
        font-family: Arial, Helvetica, sans-serif;

        background-color: rgb(130, 130, 255);

        color: white;
    }

    button{
        background-color: rgb(130, 130, 255);
        padding: 20px 40px;
        color: white;
        border: 2px solid white;
        border-radius: 25px;

        position: relative;

        box-shadow: 5px 5px black;

        margin: 20px;
    }

    button:active{
        top: 5px;
        left: 5px;

        box-shadow:none;
    }

    #Message{
        font-weight: bold;
        font-size: 1.2rem;
    }

</style>

<body>

    <h1>JavaScript Demo</h1>

    <!-- Change text color of id: Message -->
    <button id="LoadBtn">Load</button>

    <button id="changeBtn">Load Load</button>

    <!-- Waiting > Loading > loading Assets > Loading Images > Welcome -->
    <p id="Message">Waiting...</p> 


    <p id="profile">Profile</p>
    <p id="grade">Grades</p>
    <p id="schedule">Schedule</p>

    <script src="script.js"></script>
</body>
</html>
