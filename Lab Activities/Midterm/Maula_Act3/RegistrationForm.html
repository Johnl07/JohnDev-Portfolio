<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="color: white; margin: 0">
    
    <header style="text-align: center; background-color:rgb(34, 34, 153); padding: 5px">
        <h1>Registration Page</h1>
        <p>Welcome to this page</p>
    </header>

    <nav style="display: flex; gap: 20px; justify-content: center; background-color:brown; padding: 10px; border: 5px solid white; border-bottom:0">
        <a href="Home.html" style="color: white">Home</a>
        <a href="RegistrationForm.html" style="color: white">Registration Form</a>
        <a href="GradeTable.html" style="color: white">Grade Table</a>
        <a href="MyProfile.html" style="color: white">My Profile</a>
    </nav>

    <form action="" style="background-color: rgb(34, 34, 153); padding: 30px; margin: 5px">
        <h3 style="margin: 0">Student Name:</h3>
        <input type="text" name="Name" id="">

        <h3 style="margin: 20px 0 0 0">Student Number:</h3>
        <input type="text" name="Number" id="">

        <h3 style="margin: 20px 0 0 0">Student Email:</h3>
        <input type="text" name="Email" id="">

        
        <h3 style="margin: 20px 0 0 0;">Gender</h3>
        <input type="radio" name="Gender" value="M" id="">Male
        <input type="radio" name="Gender" value="F" id="">Female
        <input type="radio" name="Gender" value="R" id="">Robot
        

        <div>
            <h3 style="margin: 20px 0 0 0;">Course</h3>
            <select name="" id="">
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSOAD">BSOAD</option>
                <option value="BSHM">BSHM</option>
            </select>
        </div>

        <div>
            <h3 style="margin: 20px 0 0 0;">Skills</h3>
            <input type="checkbox" name="HTML" id="">HTML
            <input type="checkbox" name="CSS" id="">CSS
            <input type="checkbox" name="JavaScript" id="">JavaScript
        </div>

        <div>
            <h3 style="margin: 20px 0 0 0;">Upload Picture</h3>
            <input type="file" name="Photo" id="">
        </div>

        <div>
            <h3 style="margin: 20px 0 0 0;">Address</h3>
            <textarea name="" id="" rows="5" cols="35"></textarea>
        </div>

        <input type="button" name="Submit" value="Submit" id="">
        <input type="button" name="Reset" value="Reset" id="">
        
    </form>

    <footer style="background-color: rgb(34, 34, 153); padding: 5px; border: 5px solid white">
        <h3>Copyright 2022</h3>
        <h2>sdasdasdas@gmail.com</h2>
    </footer>

</body>
</html>
